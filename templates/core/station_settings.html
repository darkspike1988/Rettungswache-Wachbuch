{% extends "base.html" %}
{% block title %}Einstellungen | {{ app_name }}{% endblock %}
{% block content %}
<a class="back-link" href="{% url 'more' %}">Zurück zu Mehr</a>
<header class="page-heading narrow">
  <p class="context-line">Administration</p>
  <h1>Einstellungen</h1>
  <p class="lead">Name und sichtbare Module dieser Rettungswache festlegen.</p>
</header>
<form method="post" class="form-card narrow">
  {% csrf_token %}
  {% include "core/form_errors.html" %}
  {{ form.as_p }}
  <div class="form-actions"><button class="button primary" type="submit">Speichern</button></div>
</form>
{% endblock %}
