{% extends "base.html" %}
{% block title %}Passwort ändern | {{ app_name }}{% endblock %}
{% block content %}
<a class="back-link" href="{% url 'station_area' %}">Zurück zur Wache</a>
<header class="page-heading narrow">
  <p class="context-line">Persönlicher Zugang</p>
  <h1>Passwort ändern</h1>
</header>
<form method="post" class="form-card narrow">
  {% csrf_token %}
  {% include "core/form_errors.html" %}
  {{ form.as_p }}
  <div class="form-actions">
    <button class="button primary" type="submit">Passwort speichern</button>
    <a class="button secondary" href="{% url 'station_area' %}">Abbrechen</a>
  </div>
</form>
{% endblock %}
