openapi: 3.0.3
info:
  title: Wachbuch API
  description: |
    Versionierte JSON-API für selbst gehostetes Wachbuch.
    Widerrufbare App-Tokens (`wb_…`) und stationsbezogene Rechte.
    Wachalltag umfasst Schichtübergaben, Mängel, Fahrzeug-/Gerätestatus,
    Checklisten, Schlüssel-/Pool-Geräte, Quittierungen und leichte Auswertung.
    Zusätzliche, je Station aktivierbare Module: Pinnwand (`/pinnwand/`) sowie
    der Ende-zu-Ende-verschlüsselte Nachrichtenbereich aus Wachenchat,
    privaten Zweiergesprächen, Gruppenräumen und Secure Mail
    (`/chat/*`, `/post/*`). Der Server speichert und liefert dabei nur
    Ciphertext und Schlüsselumschläge aus; er kann Nachrichteninhalte nicht lesen.
    Patienten-, Einsatz-, Alarmierungs- und Vorgangsdaten sind ausdrücklich
    nicht Teil dieser API.
  version: "1.4.0"
servers:
  - url: /api/v1
    description: Relative to the Wachbuch origin
security:
  - TokenAuth: []
paths:
  /:
    get:
      summary: API discovery and capabilities
      security: []
      responses:
        "200": { description: Discovery document }
  /openapi.yaml:
    get:
      summary: This OpenAPI schema
      security: []
      responses:
        "200": { description: OpenAPI YAML }
  /token/:
    post:
      summary: Obtain API token using username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
                label: { type: string, maxLength: 120 }
      responses:
        "200": { description: Token created and shown once }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      summary: Revoke the presented API token
      responses:
        "200": { description: Token deactivated }
        "401": { $ref: "#/components/responses/Error" }
  /anmeldung/:
    post:
      summary: German alias for /token/
      security: []
      responses:
        "200": { description: Token created and shown once }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      summary: German alias for DELETE /token/
      responses:
        "200": { description: Token deactivated }
        "401": { $ref: "#/components/responses/Error" }
  /me/:
    get:
      summary: Current user, membership, station modules and Wachalltag capabilities
      responses:
        "200": { description: Profile payload }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /status/:
    get:
      summary: Lightweight auth/membership status
      security: []
      responses:
        "200": { description: Status payload }
  /uebersicht/:
    get:
      summary: Dashboard overview including Wachalltag counters
      responses:
        "200": { description: Overview payload }
        "403": { $ref: "#/components/responses/Error" }
  /handovers/:
    get:
      summary: Active handovers
      responses:
        "200": { description: Handover list }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Create handover
      responses:
        "201": { description: Handover created }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /handovers/{id}/:
    get:
      summary: Handover detail
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      responses:
        "200": { description: Handover detail }
        "404": { $ref: "#/components/responses/Error" }
  /handovers/{id}/status/:
    post:
      summary: Set handover status
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      responses:
        "200": { description: Handover updated }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /uebergaben/:
    get:
      summary: German alias for GET /handovers/
      responses:
        "200": { description: Handover list }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: German alias for POST /handovers/
      responses:
        "201": { description: Handover created }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /uebergaben/{id}/:
    get:
      summary: German alias for GET /handovers/{id}/
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      responses:
        "200": { description: Handover detail }
        "404": { $ref: "#/components/responses/Error" }
  /uebergaben/{id}/status/:
    post:
      summary: German alias for POST /handovers/{id}/status/
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      responses:
        "200": { description: Handover updated }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /handovers/{id}/acks/:
    get:
      summary: List acknowledgements for a handover
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      responses:
        "200":
          description: Acknowledgement list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/HandoverAck" }
        "404": { $ref: "#/components/responses/Error" }
  /handovers/{id}/ack/:
    post:
      summary: Acknowledge the explicitly read revision; idempotent per user and revision
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Existing acknowledgement returned unchanged
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      ok: { type: boolean }
                  - { $ref: "#/components/schemas/HandoverAck" }
        "201":
          description: Acknowledgement created
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      ok: { type: boolean }
                  - { $ref: "#/components/schemas/HandoverAck" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /defects/:
    get:
      summary: List station defects
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: priority, schema: { type: string } }
        - { in: query, name: overdue, schema: { type: boolean } }
      responses:
        "200":
          description: Defect list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  count: { type: integer }
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/Defect" }
    post:
      summary: Create a defect
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DefectWrite" }
      responses:
        "201": { description: Defect created }
        "422": { $ref: "#/components/responses/Error" }
  /defects/{id}/:
    get:
      summary: Defect detail including events and attachment metadata
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      responses:
        "200":
          description: Defect detail including events and attachment metadata
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      ok: { type: boolean }
                  - { $ref: "#/components/schemas/DefectDetail" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      summary: Update owner, due date, priority or descriptive fields
      description: >-
        Only the fields of DefectPatch are applied. title and category cannot be
        changed after creation: they are ignored when sent. A body without at
        least one changeable field is answered with 422, and so is a body that
        contains nothing but ignored fields.
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DefectPatch" }
      responses:
        "200": { description: Defect updated }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /defects/{id}/status/:
    post:
      summary: Change defect status; closing requires shift lead/admin
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [open, in_progress, waiting, done] }
      responses:
        "200": { description: Defect updated }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /defects/{id}/attachments/:
    get:
      summary: List image attachments for a defect
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      responses:
        "200": { description: Attachment metadata list }
    post:
      summary: Upload JPEG, PNG or WebP up to 2 MiB each; max 8 images and 12 MiB total per defect
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, content_type, data_base64]
              properties:
                filename: { type: string, maxLength: 180 }
                content_type: { type: string, enum: [image/jpeg, image/png, image/webp] }
                data_base64: { type: string, format: byte }
      responses:
        "201": { description: Attachment created }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /attachments/{id}/:
    get:
      summary: Download an authenticated defect image
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      responses:
        "200": { description: Image bytes }
        "404": { $ref: "#/components/responses/Error" }
  /assets/:
    get:
      summary: Vehicle/device status board
      responses:
        "200": { description: Asset list }
    post:
      summary: Create an asset (shift lead/admin)
      responses:
        "201": { description: Asset created }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /assets/{asset_id}/status/:
    post:
      summary: Change asset status (shift lead/admin)
      parameters:
        - in: path
          name: asset_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Asset updated }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /inventory/:
    get:
      summary: List keys and pooled devices
      responses:
        "200": { description: Inventory list }
    post:
      summary: Create inventory item (shift lead/admin)
      responses:
        "201": { description: Inventory item created }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /inventory/{item_id}/checkout/:
    post:
      summary: Check out an item to the current user
      parameters:
        - in: path
          name: item_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Item state }
        "409": { $ref: "#/components/responses/Error" }
  /inventory/{item_id}/checkin/:
    post:
      summary: Return an item
      parameters:
        - in: path
          name: item_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Item state }
        "403": { $ref: "#/components/responses/Error" }
  /kalender/:
    get:
      summary: Upcoming station calendar events
      responses:
        "200": { description: Calendar list }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Create calendar event
      responses:
        "201": { description: Calendar event created }
  /kaffeekasse/:
    get:
      summary: Coffee ledger balance and recent entries
      responses:
        "200": { description: Coffee ledger }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Append coffee ledger entry
      responses:
        "201": { description: Coffee entry created }
  /checklisten/:
    get:
      summary: Active checklists including recurring schedule state
      responses:
        "200": { description: Checklist list }
        "404": { $ref: "#/components/responses/Error" }
  /checklisten/{id}/erledigt/:
    post:
      summary: Complete checklist and advance recurring due date
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      responses:
        "201": { description: Completion recorded }
  /checklisten/{id}/abschluss/:
    post:
      summary: Alias for /erledigt/
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      responses:
        "201": { description: Completion recorded }
  /checklisten/{id}/schedule/:
    get:
      summary: Read recurring checklist schedule
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      responses:
        "200": { description: Schedule }
    put:
      summary: Set recurring checklist schedule (shift lead/admin)
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      responses:
        "200": { description: Schedule updated }
    delete:
      summary: Remove recurring schedule (shift lead/admin)
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      responses:
        "200": { description: Schedule removed }
  /reports/:
    get:
      summary: Lightweight station Wachalltag report
      responses:
        "200": { description: Aggregated counts and readiness percentage }
  /chat/identity/:
    get:
      summary: Own E2EE key bundle for local unlock
      description: Requires the station chat module and scope `read:chat`.
      responses:
        "200": { description: Key bundle, or configured=false while unset }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Register or replace the own E2EE identity
      description: Scope `write:chat`. Replacing stored keys requires `replace=true`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CryptoIdentityWrite" }
      responses:
        "200": { description: Identity stored }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /chat/keys/:
    get:
      summary: Public keys of active station members for envelope encryption
      description: Requires the station chat module, scope `read:chat` and a content role.
      responses:
        "200": { description: Member public key list }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /chat/:
    get:
      summary: Station chat feed
      description: Requires the station chat module, scope `read:chat` and a content role.
      responses:
        "200": { description: Station chat feed }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Post into the station chat
      description: Scope `write:chat`, content role and an own registered key required.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EncryptedMessageWrite" }
      responses:
        "201": { description: Message stored as ciphertext }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /chat/private/:
    get:
      summary: Private 1:1 conversations of the current user
      description: Requires the station chat module, scope `read:chat` and a content role.
      responses:
        "200": { description: Conversation list }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Open or continue a private conversation
      description: Scope `write:chat` and a content role.
      responses:
        "200": { description: Conversation opened }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /chat/private/{id}/:
    get:
      summary: Read one private conversation
      description: Scope `read:chat` and a content role.
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      responses:
        "200": { description: Private conversation }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Send into a private conversation
      description: Scope `write:chat` and a content role.
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EncryptedMessageWrite" }
      responses:
        "201": { description: Message stored as ciphertext }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /post/:
    get:
      summary: Secure Mail inbox/outbox with colleague directory
      description: Requires the station chat module, scope `read:chat` and a content role.
      responses:
        "200": { description: Mail overview }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Send a Secure Mail message
      description: Scope `write:chat` and a content role; envelope plus recipient ids.
      responses:
        "201": { description: Mail stored }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /post/{id}/:
    get:
      summary: Read one Secure Mail message (marks it read)
      description: Scope `read:chat` and a content role.
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      responses:
        "200": { description: Mail detail with recipient status }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /chat/groups/:
    get:
      summary: Group rooms the current user belongs to
      description: Requires the station chat module, scope `read:chat` and a content role.
      responses:
        "200": { description: Group list }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a group room
      description: Scope `write:chat` and a content role.
      responses:
        "201": { description: Group created }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /chat/groups/{id}/:
    get:
      summary: Read one group room
      description: Scope `read:chat`, content role and group membership.
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      responses:
        "200": { description: Group room with messages }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Post into a group room
      description: Scope `write:chat`, content role and group membership.
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EncryptedMessageWrite" }
      responses:
        "201": { description: Message stored as ciphertext }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /chat/groups/{id}/members/:
    post:
      summary: Add or remove group members (creator/admin)
      description: Scope `write:chat` and the station chat module.
      parameters: [{$ref: "#/components/parameters/IntegerId"}]
      responses:
        "200": { description: Membership updated }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /pinnwand/:
    get:
      summary: Station pinboard notices
      description: Requires an enabled pinboard module, scope `read:pinboard` and a content role.
      responses:
        "200":
          description: Notice list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  api_version: { type: string }
                  count: { type: integer }
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/PinboardNote" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a short station notice
      description: Requires an enabled pinboard module, scope `write:pinboard` and a content role.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PinboardNoteWrite" }
      responses:
        "201":
          description: Notice created
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      ok: { type: boolean }
                  - { $ref: "#/components/schemas/PinboardNote" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: "Format: Token <secret> or Bearer <secret>"
  parameters:
    IntegerId:
      in: path
      name: id
      required: true
      schema: { type: integer }
  responses:
    Error:
      description: Canonical API error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    ErrorResponse:
      type: object
      required: [ok, error]
      properties:
        ok: { type: boolean, enum: [false] }
        error:
          type: object
          required: [code, message, correlation_id]
          properties:
            code:
              type: string
              enum: [validation_error, auth_required, forbidden, mfa_required, mfa_setup_required, not_found, rate_limit, conflict, server_error]
            message: { type: string }
            correlation_id: { type: string }
    Defect:
      allOf:
        - { $ref: "#/components/schemas/DefectWrite" }
        - type: object
          required: [id, status, created_at, updated_at]
          properties:
            id: { type: integer }
            status: { type: string, enum: [open, in_progress, waiting, done] }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            attachment_count: { type: integer }
    DefectWrite:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 3000 }
        asset_ref: { type: string, maxLength: 160 }
        priority: { type: string, enum: [normal, important, urgent] }
        owner: { type: string, description: Username of an active station member }
        due_at: { type: string, format: date-time, nullable: true }
        category: { type: string, enum: [vehicle, material, safety, facility, key, device, task] }
    DefectPatch:
      type: object
      minProperties: 1
      description: >-
        Only these fields can be changed after creation. title and category are
        fixed at creation time; sending them is not an error, but they are
        ignored and do not count towards the required minimum of one field.
        At least one of the listed fields must be present, otherwise the server
        answers 422.
      properties:
        description: { type: string, maxLength: 3000 }
        asset_ref: { type: string, maxLength: 160 }
        priority: { type: string, enum: [normal, important, urgent] }
        owner: { type: string, description: Username of an active station member }
        due_at: { type: string, format: date-time, nullable: true }
    DefectEvent:
      type: object
      properties:
        kind: { type: string }
        from_status: { type: string, nullable: true }
        to_status: { type: string, nullable: true }
        by: { type: string }
        at: { type: string, format: date-time }
    Attachment:
      type: object
      properties:
        id: { type: integer }
        defect_id: { type: integer }
        filename: { type: string }
        content_type: { type: string }
        size: { type: integer }
        created_at: { type: string, format: date-time }
        uploaded_by: { type: string }
        download_url: { type: string }
    DefectDetail:
      allOf:
        - { $ref: "#/components/schemas/Defect" }
        - type: object
          properties:
            events:
              type: array
              description: At most the 100 most recent events.
              items: { $ref: "#/components/schemas/DefectEvent" }
            attachments:
              type: array
              items: { $ref: "#/components/schemas/Attachment" }
    PinboardNote:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        body: { type: string }
        category: { type: string }
        is_pinned: { type: boolean }
        author: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    HandoverAck:
      type: object
      required: [handover_id, by, at]
      properties:
        handover_id: { type: integer }
        by: { type: string }
        at: { type: string, format: date-time }
        version: { type: integer, nullable: true }
    CryptoIdentityWrite:
      type: object
      description: >
        Client-side E2EE identity. The server stores the public JWK and the
        passphrase-wrapped private JWK; it never receives the passphrase.
      required: [public_jwk, wrapped_private_jwk, kdf_salt]
      properties:
        public_jwk:
          type: object
          required: [kty, crv, x, y]
          properties:
            kty: { type: string, enum: [EC] }
            crv: { type: string, enum: [P-256] }
            x: { type: string }
            y: { type: string }
        wrapped_private_jwk: { type: string, minLength: 32, maxLength: 8000 }
        kdf_salt: { type: string, minLength: 16, maxLength: 128 }
        kdf_iterations:
          type: integer
          minimum: 100000
          maximum: 1000000
          default: 600000
        replace:
          type: boolean
          description: Must be true to overwrite already stored keys.
    EncryptedMessageWrite:
      type: object
      description: >
        Client-encrypted message. The server validates structure and recipient
        coverage only; it never decrypts the payload.
      required: [ciphertext, nonce, key_wraps]
      properties:
        ciphertext: { type: string, description: Base64url AES-GCM ciphertext }
        nonce: { type: string, description: Base64url nonce }
        key_wraps:
          type: object
          description: Map of recipient user id to that recipient's wrapped content key.
          additionalProperties:
            type: object
            required: [epk, wrapped_key]
            properties:
              epk:
                type: object
                properties:
                  kty: { type: string }
                  crv: { type: string }
                  x: { type: string }
                  y: { type: string }
              wrapped_key: { type: string, description: "iv.data, both base64url" }
        algo: { type: string, description: Declared algorithm, e.g. A256GCM }
    PinboardNoteWrite:
      type: object
      required: [title, body]
      properties:
        title: { type: string, maxLength: 140 }
        body: { type: string, maxLength: 2000 }
        category: { type: string, enum: [info, important, event], default: info }
