name: wachbuch_mobile
description: AGPL companion app for self-hosted Wachbuch (iOS/Android).
publish_to: "none"
version: 0.5.1+9

environment:
  sdk: ^3.8.0

dependencies:
  app_links: ^7.2.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  geolocator: ^14.0.2
  http: ^1.4.0
  intl: any
  mobile_scanner: ^7.4.0
  permission_handler: ^12.0.3
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
