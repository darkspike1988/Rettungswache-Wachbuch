{% if page_obj.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Seitennavigation">
  {% if page_obj.has_previous %}<a href="?seite={{ page_obj.previous_page_number }}{% if scope %}&amp;ansicht={{ scope }}{% endif %}{% if feed_type %}&amp;typ={{ feed_type }}{% endif %}{% if query %}&amp;q={{ query|urlencode }}{% endif %}">Zurück</a>{% endif %}
  <span>Seite {{ page_obj.number }} von {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a href="?seite={{ page_obj.next_page_number }}{% if scope %}&amp;ansicht={{ scope }}{% endif %}{% if feed_type %}&amp;typ={{ feed_type }}{% endif %}{% if query %}&amp;q={{ query|urlencode }}{% endif %}">Weiter</a>{% endif %}
</nav>
{% endif %}
