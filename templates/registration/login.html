{% extends "base.html" %}
{% block title %}Anmelden | {{ app_name }}{% endblock %}
{% block content %}
<section class="access-panel">
  <p class="context-line">Persönlicher Zugang</p>
  <h1>Anmelden</h1>
  <form method="post" class="form-card">
    {% csrf_token %}
    {% include "core/form_errors.html" %}
    {{ form.as_p }}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <button class="button primary" type="submit">Anmelden</button>
    <p class="field-hint"><a href="{% url 'password_reset' %}">Passwort vergessen?</a></p>
  </form>
</section>
{% endblock %}
