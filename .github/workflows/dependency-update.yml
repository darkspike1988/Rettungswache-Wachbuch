name: Dependency Update

on:
  schedule:
    - cron: '0 0 1 * *'  # Monatlich am 1. um Mitternacht
  workflow_dispatch:
    inputs:
      force:
        description: 'Force update even if no changes'
        required: false
        default: 'false'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependency-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: pip

      - name: Install pip-tools
        run: pip install pip-tools

      - name: Update dependencies
        run: |
          # Aktualisiere requirements.txt mit neuen Versionen
          pip-compile --upgrade --allow-unsafe --generate-hashes --output-file requirements.lock requirements.txt
          
          # Prüfe ob sich etwas geändert hat
          git diff --quiet requirements.lock || {
            echo "::set-output name=has_changes::true"
            git config user.name "Dependency Bot"
            git config user.email "bot@rettungswache-wachbuch.de"
            git add requirements.lock
            git commit -m "chore: update Python dependencies"
            git push
          }
        id: update

      - name: Create Pull Request
        if: steps.update.outputs.has_changes == 'true' || github.event.inputs.force == 'true'
        uses: peter-evans/create-pull-request@153407881132f5e791b2244679ad536122b08d82
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update Python dependencies"
          title: "chore: update Python dependencies"
          body: |
            Automatische Aktualisierung der Python-Abhängigkeiten.
            
            **Änderungen:**
            - `requirements.lock` mit neuen Versionen und Hashes
            
            **Manuelle Prüfung erforderlich:**
            - [ ] Testsuite läuft erfolgreich
            - [ ] Keine Breaking Changes in den Updates
            - [ ] Changelogs der Pakete prüfen
          branch: "auto/dependency-update"
          delete-branch: true
          labels: dependencies,automated
