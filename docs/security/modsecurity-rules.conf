# ModSecurity Rules for Rettungswache-Wachbuch
# Custom rules to complement OWASP Core Rule Set (CRS)
# 
# Usage:
# 1. Copy this file to /etc/nginx/modsec/modsecurity-rules.conf
# 2. Include it in your ModSecurity configuration:
#    Include /etc/nginx/modsec/modsecurity-rules.conf
#
# These rules are specifically tuned for the Rettungswache-Wachbuch application

# =============================================================================
# RULE: Disable CRS rules that cause false positives
# =============================================================================

# Disable rule 941180 (Restricted SQL Character Anomaly Detection)
# This rule often triggers false positives with JSON API requests
SecRuleUpdateTargetById 941180 "!REQUEST_HEADERS:User-Agent"
SecRuleUpdateTargetById 941180 "!ARGS_NAMES"
SecRuleUpdateTargetById 941180 "!ARGS"
SecRuleUpdateTargetById 941180 "!REQUEST_COOKIES"

# Disable rule 942100 (SQL Injection Attack Detected via libinjection)
# Only for specific API endpoints that use JSON
SecRule REQUEST_FILENAME "@pm /api/v1/handovers/ /api/v1/kalender/ /api/v1/kaffeekasse/ /api/v1/checklisten/" \
    "id:1001,phase:1,nolog,pass,ctl:ruleRemoveById=942100"

# =============================================================================
# RULE: Rate Limiting for API Endpoints
# =============================================================================

# Login endpoint rate limiting (10 requests per minute per IP)
SecRule REQUEST_FILENAME "@pm /api/v1/token/ /api/v1/anmeldung/" \
    "id:1010,phase:5,nolog,pass,setvar:ip.rate_limit_login=+1,expirevar:ip.rate_limit_login=60"

SecRule IP:RATE_LIMIT_LOGIN "@gt 10" \
    "id:1011,phase:5,deny,status:429,msg:'Too many login attempts from this IP',logdata:'Rate limit exceeded: 10 requests per minute'"

# API endpoint rate limiting (100 requests per minute per IP)
SecRule REQUEST_FILENAME "@pm /api/v1/" \
    "id:1020,phase:5,nolog,pass,setvar:ip.rate_limit_api=+1,expirevar:ip.rate_limit_api=60"

SecRule IP:RATE_LIMIT_API "@gt 100" \
    "id:1021,phase:5,deny,status:429,msg:'Too many API requests from this IP',logdata:'Rate limit exceeded: 100 requests per minute'"

# =============================================================================
# RULE: Allow specific JSON patterns that might trigger CRS
# =============================================================================

# Allow JSON content type
SecRule REQUEST_HEADERS:Content-Type "@pm application/json application/x-www-form-urlencoded" \
    "id:1030,phase:1,nolog,pass,ctl:ruleRemoveById=941100"

# Allow common JSON keys used in the API
SecRule ARGS_NAMES "@pm username password label token title details category priority status" \
    "id:1031,phase:2,nolog,pass,ctl:ruleRemoveById=941100"

# =============================================================================
# RULE: Block suspicious patterns specific to this application
# =============================================================================

# Block requests trying to access admin interfaces without proper auth
SecRule REQUEST_FILENAME "@pm /django-admin/ /admin/" \
    "id:1040,phase:1,deny,status:403,msg:'Admin access denied',chain"
SecRule REQUEST_HEADERS:Cookie "!@contains rwsth_session" \
    "t:none"

# Block requests with suspicious SQL patterns
SecRule REQUEST_BODY "@detectSQLi" \
    "id:1041,phase:2,deny,status:403,msg:'SQL Injection Attempt Detected',severity:CRITICAL"

# Block requests with suspicious XSS patterns
SecRule REQUEST_BODY "@detectXSS" \
    "id:1042,phase:2,deny,status:403,msg:'XSS Attempt Detected',severity:CRITICAL"

# Block path traversal attempts
SecRule REQUEST_FILENAME "@pm ../ ./ /etc/passwd /bin/ /usr/bin/" \
    "id:1043,phase:1,deny,status:403,msg:'Path Traversal Attempt Detected',severity:CRITICAL"

# =============================================================================
# RULE: Custom rules for specific endpoints
# =============================================================================

# Allow POST to /api/v1/token/ without CSRF token (it's a public endpoint)
SecRule REQUEST_FILENAME "@pm /api/v1/token/ /api/v1/anmeldung/" \
    "id:1050,phase:1,nolog,pass,ctl:ruleRemoveById=941110"

# Allow GET requests to /api/v1/ without authentication (discovery)
SecRule REQUEST_METHOD "GET" \
    "id:1051,phase:1,nolog,pass,chain"
SecRule REQUEST_FILENAME "@pm /api/v1/ /api/v1/openapi.yaml" \
    "t:none,ctl:ruleRemoveById=941110"

# =============================================================================
# RULE: Geo-blocking (optional, uncomment to enable)
# =============================================================================

# Block requests from known malicious countries
# SecRule REMOTE_ADDR "@pmFromFile /etc/nginx/modsec/blocked_countries.txt" \
#     "id:1060,phase:1,deny,status:403,msg:'Request from blocked country'"

# =============================================================================
# RULE: User Agent blocking (optional, uncomment to enable)
# =============================================================================

# Block requests with empty or suspicious user agents
# SecRule REQUEST_HEADERS:User-Agent "^$" \
#     "id:1070,phase:1,deny,status:403,msg:'Empty User Agent'"

# Block known bad bots
# SecRule REQUEST_HEADERS:User-Agent "@pm sqlmap nikto dirbuster" \
#     "id:1071,phase:1,deny,status:403,msg:'Known Bad Bot Detected'"

# =============================================================================
# RULE: Request size limits
# =============================================================================

# Limit request body size for API endpoints
SecRule REQUEST_FILENAME "@pm /api/v1/" \
    "id:1080,phase:1,nolog,pass,ctl:requestBodyLimit=1048576"

# Limit request body size for file uploads
SecRule REQUEST_FILENAME "@pm /upload/ /media/" \
    "id:1081,phase:1,nolog,pass,ctl:requestBodyLimit=10485760"

# =============================================================================
# RULE: Response filtering (optional)
# =============================================================================

# Remove sensitive headers from responses
SecRule RESPONSE_HEADERS "@pm Server X-Powered-By X-AspNet-Version" \
    "id:1090,phase:3,nolog,pass,ctl:removeResponseHeader=Server"

# =============================================================================
# RULE: Logging customization
# =============================================================================

# Log all blocked requests
SecDefaultAction "phase:1,deny,status:403,log,auditlog"

# Custom log format
SecAuditLogFormat JSON
SecAuditLog /var/log/modsec/audit.log

# =============================================================================
# END OF RULES
# =============================================================================
